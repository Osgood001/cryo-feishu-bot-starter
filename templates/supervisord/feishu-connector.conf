; Replace every REPLACE_WITH_* token. Run under a dedicated unprivileged account.
[program:cryo-feishu-connector]
directory=REPLACE_WITH_ABSOLUTE_CHAMBER_PATH
command=/usr/bin/env python3 REPLACE_WITH_ABSOLUTE_CHAMBER_PATH/connector/feishu_connector.py run
environment=CHAMBER_DIR="REPLACE_WITH_ABSOLUTE_CHAMBER_PATH",CONNECTOR_STATE_DIR="REPLACE_WITH_ABSOLUTE_STATE_PATH",LARK_CLI="REPLACE_WITH_ABSOLUTE_LARK_CLI_PATH",LARK_CLI_PROFILE="REPLACE_WITH_LARK_PROFILE_NAME",CRYO_AGENT="REPLACE_WITH_ABSOLUTE_CRYO_AGENT_PATH",FEISHU_BOT_NAME="REPLACE_WITH_BOT_DISPLAY_NAME",FEISHU_BOT_OPEN_ID="ou_REPLACE_WITH_BOT_OPEN_ID",BOT_SIGNATURE="REPLACE_WITH_PUBLIC_BOT_SIGNATURE",OUTBOX_POLL_SEC="2",DEADLETTER_AFTER_SEC="900",MAX_REPLY_CHARS="20000"
autostart=true
autorestart=unexpected
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=REPLACE_WITH_ABSOLUTE_LOG_PATH
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
umask=077
